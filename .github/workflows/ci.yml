name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  action:
    name: Action self-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Make the demo repo
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run build
          node -e "import('./dist/demo.js').then((m) => m.createDemoRepo(process.argv[1]))" "$RUNNER_TEMP/demo"
      # A stand-in agent, so the self-test needs no API key and spends nothing.
      - uses: ./
        id: whobrokeit
        # The Action builds itself with TypeScript, which NODE_ENV=production would leave out.
        env:
          NODE_ENV: production
        with:
          # Issue text is written by strangers: one that looks like an option must stay a
          # description. If it became --test, there would be no suggested fix to find below.
          bug: '--test=exit 1 Adding 3 mugs costs the same as 1 mug.'
          agent: node "${{ github.workspace }}/test/fixtures/fake-agent.mjs"
          anthropic-api-key: sk-fake
          working-directory: ${{ runner.temp }}/demo
          comment: 'false'
      - name: Check the result
        shell: bash
        env:
          CODE: ${{ steps.whobrokeit.outputs.exit-code }}
          COMMIT: ${{ steps.whobrokeit.outputs.commit }}
          REPORT: ${{ steps.whobrokeit.outputs.report }}
        run: |
          test "$CODE" = 0 || { echo "exit code $CODE"; exit 1; }
          test -n "$COMMIT" || { echo "no commit"; exit 1; }
          grep -q 'refactor: simplify subtotal with reduce' "$REPORT"
          grep -q '## Suggested fix' "$REPORT"
